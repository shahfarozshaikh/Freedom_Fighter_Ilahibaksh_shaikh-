    <h2 class="section-title">शौर्य आणि राष्ट्रसेवेचा जीवनप्रवास</h2>
    <p class="subtitle">भावी पिढ्यांसाठी त्यांच्या मूल्यांचा, शौर्याचा आणि ऐतिहासिक शासकीय नोंदींचा जतन केलेला गौरवशाली वारसा.</p>
    <div class="facts">

    </div>
    
    <div class="card" style="margin-top:40px; border:2px solid var(--gold); background:#fffcf7; border-radius:18px; padding:30px;">
      <h3 style="text-align:center; color:var(--green); font-size:22px; font-weight:bold;">शासकीय सन्मान प्राप्त स्वातंत्र्य सैनिक</h3>
      <p style="text-align:center; font-size:20px; color:var(--gold); font-weight:bold; margin-top:-10px;">श्री शेख इलाहीबक्ष महंमदसाहेब (सोलापूर)</p>
      <div class="tricolor" style="margin:10px auto;"><span class="saffron"></span><span class="white"></span><span class="green"></span></div>
      <div style="color:#333; font-size:15px; line-height:1.7;">
        <p><b>• १९४० पासून सक्रिय सहभाग:</b> भारत देशाच्या मुक्तीसाठी काँग्रेस संघटनेत अत्यंत सक्रिय झाले. सोलापूर व महाराष्ट्रातील वरिष्ठ नेत्यांसोबत निष्ठापूर्वक कार्य केले.</p>
        <p><b>• १९४२ चले जाव व भूमिगत लढा:</b> महात्मा गांधीजींच्या आंदोलनात स्वतःला झोकून दिले. पोलिसांच्या अटकेपासून वाचण्यासाठी भूमिगत राहून चळवळ सुरू ठेवली.</p>
        <p><b>• चरित्रकोश नोंद (खंड ३, पृष्ठ ५८५):</b> शासकीय दस्तऐवजातील नोंद: <i>"या काळात भूमिगत कार्य; स्वातंत्र्य सैनिकांना रसद पुरविणे, प्रचारपत्रके वाटणे; पोलिसांकडून मारहाण."</i> त्यांनी पोलिसांच्या मारहाणीचा धैर्याने सामना केला.</p>
        <p><b>• काँग्रेस पुस्तिका व पोलिसांचा छापा:</b> काँग्रेस जन्मशताब्दी पुस्तिकेत (नोंद ११९) आदरपूर्वक समावेश. रात्री गुप्तपणे पत्रके छापून उत्तर कसबा भागात चिकटविण्याचे धाडसी कार्य केले. घरावर सशस्त्र छापा टाकला असता, ते सुरक्षितपणे गुलबर्गा येथे निसटले.</p>
        <p><b>• शासकीय सन्मान पत्र (७ डिसेंबर १९८७):</b> महाराष्ट्र शासनाने ७ डिसेंबर १९८७ रोजी त्यांना अधिकृत <b>‘सन्मान पत्र’</b> आणि स्वातंत्र्यसैनिक पेन्शन देऊन गौरविले. सोलापूर मनपातर्फे मोफत बस प्रवासासाठी ओळखपत्र (क्र. ४८) देण्यात आले.</p>
      </div>

  </section>
